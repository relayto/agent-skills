name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Manifests, skill frontmatter, public-content scan
        run: npm run validate
        env:
          CONTENT_BLOCKLIST: ${{ secrets.CONTENT_BLOCKLIST }}

      - name: npx skills finds every skill
        run: npm run skills-cli

      - name: Claude Code accepts the plugin and marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.318 plugin validate .

      - name: The plugin version moves with every change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD -- skills plugin.json mcp.json .mcp.json .claude-plugin | grep -q .; then
            git show "$BASE:plugin.json" > "$RUNNER_TEMP/base-plugin.json"
            old=$(node -p "require('$RUNNER_TEMP/base-plugin.json').version")
            new=$(node -p "require('./plugin.json').version")
            if [ "$old" = "$new" ]; then
              echo "::error::Skills or plugin files changed but the plugin is still $new. Bump version in plugin.json and .claude-plugin/plugin.json: Claude Code only updates installs when it changes."
              exit 1
            fi
            echo "plugin $old -> $new"
          fi
